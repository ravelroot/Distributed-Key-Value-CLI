# Leme no Kubernetes: 3 nós lemed em um StatefulSet, cada um com o seu volume,
# um Service headless para os nós se acharem pelo DNS e o console web.
#
#   kubectl create namespace leme
#   kubectl -n leme create secret generic leme-token \
#     --from-literal=token="$(openssl rand -hex 24)" \
#     --from-literal=token-console="$(openssl rand -hex 24)"
#   kubectl -n leme apply -f deploy/kubernetes/leme.yaml
#   kubectl -n leme port-forward svc/leme-console 8080:8080
#
# A imagem é a do Dockerfile do projeto (docker build -t leme:1.1.0 .).
apiVersion: v1
kind: Service
metadata:
  name: leme
  labels: { app.kubernetes.io/name: leme, app.kubernetes.io/component: no }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: leme, app.kubernetes.io/component: no }
  ports:
    - { name: leme, port: 7400 }
    - { name: metricas, port: 9400 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: leme
spec:
  serviceName: leme
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: { app.kubernetes.io/name: leme, app.kubernetes.io/component: no }
  template:
    metadata:
      labels: { app.kubernetes.io/name: leme, app.kubernetes.io/component: no }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: /metricas
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 101 }
      terminationGracePeriodSeconds: 30
      containers:
        - name: lemed
          image: leme:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: leme, containerPort: 7400 }
            - { name: metricas, containerPort: 9400 }
          env:
            - name: POD
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: LEME_ID, value: "$(POD)" }
            - { name: LEME_CLUSTER, value: leme }
            - { name: LEME_ENDERECO, value: "0.0.0.0:7400" }
            - { name: LEME_ANUNCIAR, value: "$(POD).leme:7400" }
            - { name: LEME_ENTRAR, value: "leme-0.leme:7400,leme-1.leme:7400,leme-2.leme:7400" }
            - { name: LEME_DADOS, value: /var/lib/leme }
            - { name: LEME_METRICAS, value: "0.0.0.0:9400" }
            - { name: LEME_REPLICAS, value: "3" }
            - { name: LEME_SINCRONIZAR, value: intervalo }
            - { name: LEME_LOG_FORMATO, value: json }
            - name: LEME_TOKEN
              valueFrom: { secretKeyRef: { name: leme-token, key: token } }
          readinessProbe:
            httpGet: { path: /saude, port: metricas }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /saude, port: metricas }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: dados, mountPath: /var/lib/leme }
  volumeClaimTemplates:
    - metadata: { name: dados }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leme-console
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: leme, app.kubernetes.io/component: console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: leme, app.kubernetes.io/component: console }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: console
          image: leme:1.1.0
          command: ["leme", "console", "--endereco", "0.0.0.0:8080", "--nos", "leme-0.leme:7400,leme-1.leme:7400,leme-2.leme:7400"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: LEME_TOKEN
              valueFrom: { secretKeyRef: { name: leme-token, key: token } }
            - name: LEME_TOKEN_CONSOLE
              valueFrom: { secretKeyRef: { name: leme-token, key: token-console } }
          readinessProbe:
            httpGet: { path: /api/v1/saude, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: leme-console
spec:
  selector: { app.kubernetes.io/name: leme, app.kubernetes.io/component: console }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: leme
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: leme, app.kubernetes.io/component: no }
